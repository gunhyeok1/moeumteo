name = "contest-platform"
compatibility_date = "2026-01-01"
# main / [assets] 는 일부러 안 적습니다 — `astro build`가 dist/server/wrangler.json에
# 직접 채워 넣고, wrangler deploy가 그 파일을 자동으로 찾아 씁니다.
# (여기서 손으로 적으면 build 시점에 "파일이 없다" 에러가 납니다.)

[[d1_databases]]
binding = "DB"
database_name = "contest-platform-db"
# wrangler d1 create contest-platform-db 실행 후 나오는 database_id로 교체하세요.
database_id = "aa496dc1-48f4-4eb3-aa82-0b0551e26d14"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "FILES_KV"
# Cloudflare 대시보드 → Workers & Pages → KV → Create a namespace 로 만든 뒤
# 그 네임스페이스의 ID로 교체하세요. (R2처럼 결제수단 등록이 필요 없어요.)
id = "2975aaa2276b49e7b3bb98330b66ad63"
